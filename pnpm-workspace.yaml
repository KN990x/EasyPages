# pnpm settings for EasyPages (not a monorepo: since v10 pnpm reads its settings from this
# file).

# pnpm blocks dependency install scripts by default — the classic npm supply-chain vector.
# They are allowed one by one here. esbuild needs one to place its native binary, and it is
# a build-time dependency only: since scrypt replaced bcrypt there is no native code left in
# the production tree at all, which is what lets the runtime image skip scripts entirely.
allowBuilds:
  esbuild: true

# Minimum age a version must have before a fresh resolution will consider it: 7 days
# (10080 minutes). Avoids installing a package published hours ago, which is exactly the
# window in which malicious publishes get caught. Deliberately aligned with
# `cooldown: default-days: 7` in .github/dependabot.yml.
# pnpm 11 also checks an existing lockfile against it, --frozen-lockfile included: an entry
# younger than 7 days fails the install (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) in CI and in
# the Docker build. A Dependabot security PR for a fresh release therefore stays red until the
# version is 7 days old; security updates do not honour the Dependabot cooldown.
minimumReleaseAge: 10080

# Moved here from .npmrc: pnpm 11 only reads auth settings from .npmrc.
# Fail instead of silently installing when the lockfile and package.json disagree. CI already
# does this by default; this extends it to local environments.
preferFrozenLockfile: true

# Peer dependency warnings should not break the install.
strictPeerDependencies: false

# Moved here from package.json, which pnpm 11 no longer reads for settings. Keeps every copy
# of nanoid on a release with the fix for its predictable-ID advisory.
overrides:
  nanoid: ">=3.3.17"
